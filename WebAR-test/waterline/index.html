<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>水辺のライン認識</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
                     font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        #camera-feed {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        #overlay-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #start-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #14141e;
            color: #fff;
            text-align: center;
            padding: 24px;
        }
        #start-overlay.hidden { display: none; }
        #start-button {
            padding: 18px 48px;
            font-size: 22px;
            font-weight: bold;
            color: #111;
            background: #e8e8e8;
            border: none;
            border-radius: 8px;
        }
        #start-overlay p {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            line-height: 1.8;
        }

        #hud {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 8px;
            max-width: 92%;
            text-align: center;
            pointer-events: none;
        }
        #hud.hidden { display: none; }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 13px;
            padding: 10px 18px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 6px 10px;
        }
        #controls.hidden { display: none; }
        #controls input[type="range"] { width: 150px; }
    </style>
</head>
<body>
    <video id="camera-feed" autoplay muted playsinline></video>
    <canvas id="overlay-layer"></canvas>

    <div id="start-overlay">
        <h1 style="font-size:26px; margin-bottom:16px;">水辺のライン認識</h1>
        <button id="start-button">カメラを起動</button>
        <p>
            水面を水平な面として認識し、面のあちこちから光の粒を立ち上らせます。<br>
            画面の下半分に水面が入るように構えてください。<br>
            認識位置がずれるときは、画面に映った水面をタップしてください。
        </p>
    </div>

    <div id="hud" class="hidden"><span id="hud-text"></span></div>
    <div id="controls" class="hidden">
        <label for="tolerance">色の許容差</label>
        <input type="range" id="tolerance" min="8" max="60" value="26">
        <label for="cam-height">カメラの高さ</label>
        <input type="range" id="cam-height" min="0.8" max="4.0" step="0.1" value="1.5">
    </div>

    <script src="waterline.js"></script>
    <script>
    const video = document.getElementById('camera-feed');
    const hud = document.getElementById('hud');
    const hudText = document.getElementById('hud-text');

    async function start() {
        // iOS: DeviceOrientation はユーザー操作起点の許可が必要
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
            try { await DeviceOrientationEvent.requestPermission(); } catch (e) { /* 拒否時も続行 */ }
        }
        window.addEventListener('deviceorientation', e => {
            Waterline.setOrientation(e.alpha, e.beta, e.gamma);
        });

        try {
            video.srcObject = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 } },
                audio: false,
            });
            await video.play();
        } catch (e) {
            alert(`カメラを起動できません: ${e.message}`);
            return;
        }
        document.getElementById('start-overlay').classList.add('hidden');
        document.getElementById('controls').classList.remove('hidden');

        Waterline.init({
            source: video,
            getW: () => video.videoWidth,
            getH: () => video.videoHeight,
            layer: document.getElementById('overlay-layer'),
            toleranceInput: document.getElementById('tolerance'),
            camHeightInput: document.getElementById('cam-height'),
            onStatus: t => { hud.classList.remove('hidden'); hudText.textContent = t; },
        });

        window.addEventListener('click', ev => {
            if (Waterline.setSeedFromScreen(ev.clientX, ev.clientY)) {
                hudText.textContent = 'タップ位置を水面として認識し直します';
            }
        });
    }

    document.getElementById('start-button').addEventListener('click', start);
    document.getElementById('controls').addEventListener('click', e => e.stopPropagation());
    // 開始画面のクリックがwindowのタップ処理 (シード指定) に届かないようにする
    document.getElementById('start-overlay').addEventListener('click', e => e.stopPropagation());
    </script>
</body>
</html>
